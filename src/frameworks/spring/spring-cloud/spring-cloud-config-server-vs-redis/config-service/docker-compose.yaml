version: '3.1'

services:
  postgres:
    image: postgres:14.2
    container_name: mp-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend

  redis-client:
    image: redis:7-alpine
    container_name: redis-client
    command: redis-cli -h redis
    depends_on:
      - redis
    networks:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge